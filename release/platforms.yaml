platforms:
  - os: linux
    arch: amd64
    runner: ubuntu-26.04
    target: x86_64-unknown-linux-gnu
    binary: codex-proxy-rs
    archive: tar.gz
    docker: true
    dockerPlatform: linux/amd64

  - os: linux
    arch: arm64
    runner: ubuntu-24.04-arm
    target: aarch64-unknown-linux-gnu
    binary: codex-proxy-rs
    archive: tar.gz
    docker: true
    dockerPlatform: linux/arm64
